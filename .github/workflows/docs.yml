name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mdBook
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build documentation
        run: mdbook build

      - name: Check GitHub Pages status
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$RUNNER_TEMP/pages.json"
          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$body" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")

          enabled=false
          case "$status" in
            200)
              if [ "$(jq -r '.build_type // "legacy"' "$body")" = "workflow" ]; then
                enabled=true
              else
                echo "::warning title=GitHub Pages source is not Actions::Set Settings > Pages > Build and deployment > Source to \"GitHub Actions\" to publish the docs. Skipping deploy."
              fi
              ;;
            404)
              echo "::warning title=GitHub Pages is not enabled::Enable it under Settings > Pages with Source set to \"GitHub Actions\" to publish the docs. Skipping deploy."
              ;;
            *)
              echo "::error title=Could not query GitHub Pages::GitHub API returned HTTP $status for /repos/$GITHUB_REPOSITORY/pages."
              cat "$body"
              exit 1
              ;;
          esac

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "false" ]; then
            echo "Documentation built successfully, but GitHub Pages is not set up for Actions deployments, so the site was not published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    if: needs.build.outputs.pages-enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
